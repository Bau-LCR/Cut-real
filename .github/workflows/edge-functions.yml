name: Edge Functions

on:
  push:
    branches: [main, feature/automatic-memory-task-pairing]
  pull_request:
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - 'supabase/migrations/**'
      - '.github/workflows/edge-functions.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --no-lock supabase/functions/admin/index.ts supabase/functions/memory-task-pairing/index.ts
