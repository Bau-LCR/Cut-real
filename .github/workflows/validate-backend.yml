name: Validate Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - '.github/workflows/validate-backend.yml'
  pull_request:
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deno-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Edge Functions
        run: |
          deno check --node-modules-dir=auto \
            supabase/functions/chat/index.ts \
            supabase/functions/admin/index.ts \
            supabase/functions/api/index.ts \
            supabase/functions/transcribe/index.ts \
            supabase/functions/tts/index.ts \
            supabase/functions/generate-document/index.ts
