name: Deploy Cut-real Memory Task integration

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20261115000100_memory_task_pairing.sql'
      - 'supabase/functions/admin/**'
      - 'supabase/functions/memory-task-pairing/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-memory-task.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployment access
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD repository secrets before deploying."
            exit 1
          fi
      - name: Apply database migration
        run: npx supabase@latest db push --project-ref vdgfrrdseqimbelgzsek --password "$SUPABASE_DB_PASSWORD"
      - name: Deploy integration Edge Functions
        run: npx supabase@latest functions deploy admin memory-task-pairing --project-ref vdgfrrdseqimbelgzsek
